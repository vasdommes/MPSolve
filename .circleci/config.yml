# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1

jobs:
  build-and-test:
    macos:
      xcode: 16.4.0
    resource_class:  macos.m1.medium.gen1
    steps:
      - checkout
      - run:
          name: Setup environment
          command: |
            HOMEBREW_NO_AUTO_UPDATE=1
            HOMEBREW_NO_INSTALL_CLEANUP=1
            HOMEBREW_NO_ANALYTICS=1
            brew install gmp mpfr boost rapidjson libarchive openblas flint cmake open-mpi metis automake libtool pkgconf bison flex
      - run:
          name: Print software versions
          command: |
            mpicxx --version
            which bison
            bison --version
            `brew --prefix bison`/bin/bison --version
            which flex
            flex --version
      - run:
          name: Build MPSolve
          command: |
            CC=mpicc
            CXX=mpicxx
            LDFLAGS="-L`brew --prefix gmp`/lib -L`brew --prefix bison`/lib -L`brew --prefix flex`/lib"
            CPPFLAGS="-I`brew --prefix gmp`/include -I`brew --prefix bison`/include -I`brew --prefix flex`/include"
            ./autogen.sh
            ./configure --prefix=$HOME/install --disable-dependency-tracking --disable-examples --disable-ui --disable-graphical-debugger --disable-documentation
            make
            make install
      - run:
          name: Check installation
          command: |
            make installcheck
            echo "simple mpsolve test:" && $HOME/install/bin/mpsolve -p "x^4-6*x^9+6/7*x + 5"

workflows:
  macos-test:
    jobs:
      - build-and-test
